<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Избранное — Capital Coffee</title>
    <link rel="stylesheet" href="final.css">
</head>
<body>

<div class="header">
    <a href="index.html" class="logo">
        CAPITAL
        <span>COFFEE</span>
    </a>

    <nav class="navigation">
        <a href="index.html#home">Главная</a>
        <a href="index.html#menu">Меню</a>
        <a href="index.html#about">О нас</a>
        <a href="index.html#contacts">Контакты</a>
    </nav>

    <div class="header-icons">
        <a href="izb.html">♥</a>
        <a href="kor.html">🛒</a>
    </div>
</div>

<section class="menu-section">
    <div class="menu-heading">
        <div>
            <p class="section-label">ИЗБРАННОЕ</p>
            <h2>Ваши любимые<br>блюда</h2>
        </div>
    </div>
    <div class="products" id="list"></div>
</section>

<script src="final.js"></script>
<script>
    var list = document.getElementById("list");

    function showFavorites() {
        var fav = getList("favorites");
        list.innerHTML = "";

        if (fav.length == 0) {
            list.innerHTML = "<p class='empty'>Пока ничего нет</p>";
            return;
        }

        for (var i = 0; i < fav.length; i++) {
            var p = fav[i];
            list.innerHTML = list.innerHTML + `
                <article class="product-card">
                    <div class="product-image"><img src="${p.img}" alt="${p.name}"></div>
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <div class="product-bottom">
                            <strong>${p.price} ₸</strong>
                            <div class="product-buttons">
                                <button class="remove" data-id="${p.id}">×</button>
                            </div>
                        </div>
                    </div>
                </article>`;
        }
    }

    list.addEventListener("click", function (event) {
        var btn = event.target.closest(".remove");
        if (btn == null) {
            return;
        }

        var fav = getList("favorites");
        var newFav = [];
        for (var i = 0; i < fav.length; i++) {
            if (fav[i].id != btn.dataset.id) {
                newFav.push(fav[i]);
            }
        }
        saveList("favorites", newFav);
        showFavorites();
    });

    showFavorites();
</script>
</body>
</html>
